# Render Blueprint for the FastAPI service.
# Deploy: push this file, then Render dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  # This branch's app serves BOTH the REST API and the MCP server (mounted at
  # /mcp) from one process. Distinct name + branch so it deploys independently
  # of the REST-only `nal-api` service that tracks feature/fastapi-phase-1.
  - type: web
    name: nal-api-mcp
    runtime: python
    plan: free
    branch: feature/mcp-server
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    autoDeploy: true
