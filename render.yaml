# Render Blueprint for the FastAPI service.
# Deploy: push this file, then Render dashboard -> New -> Blueprint -> pick this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  # This branch's app serves BOTH the REST API and the MCP server (mounted at
  # /mcp) from one process. The `nal-api` service is pointed at this branch, so
  # one URL (nal-api.onrender.com) covers REST and MCP.
  - type: web
    name: nal-api
    runtime: python
    plan: free
    branch: feature/mcp-server
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    autoDeploy: true
