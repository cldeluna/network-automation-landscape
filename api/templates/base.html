<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Network Automation Landscape{% endblock %}</title>
  <style>
    :root { --fg:#1b1f24; --muted:#586069; --border:#d0d7de; --accent:#0969da; --bg:#f6f8fa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           color: var(--fg); margin: 0; background: #fff; line-height: 1.45; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 20px 80px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 20px; padding: 16px 18px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 0.9rem; }
    input[type=text], input[type=email], input[type=url], select, textarea {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
      font: inherit; background: #fff; }
    textarea { min-height: 60px; resize: vertical; }
    .help { color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-top: 2px; }
    .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; }
    .checks label { font-weight: 400; margin: 0; display: flex; align-items: center; gap: 5px; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
             padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .errors { background: #ffebe9; border: 1px solid #ff818266; border-radius: 6px;
              padding: 12px 16px; margin: 0 0 20px; }
    .errors ul { margin: 6px 0 0; padding-left: 20px; }
    .ok { background: #dafbe1; border: 1px solid #4ac26b66; border-radius: 6px; padding: 16px; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
          padding: 12px; overflow-x: auto; font-size: 0.8rem; }
    .contact-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .contact-row input { flex: 1; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
