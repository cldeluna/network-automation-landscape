# Sidecar extended data owned by the FastAPI layer.
# See CLAUDE.md for the full schema.

# Map of tool slug -> list of voluntary contacts.
# Example:
# contacts:
#   netbox-community:
#     - name: Jane Doe
#       role: maintainer
#       github: janedoe
#       voluntary: true
contacts: {}

# Use cases are NOT stored here. They live in a separate Use Case system
# (its own service/database). The landscape only links out to it. Set the
# system's base URL below once it exists, or via the UC_SYSTEM_URL env var
# (the env var wins). Until set, use-case endpoints return configured: false.
use_case_system:
  base_url: null

# Map of tool slug -> formal NAF mapping override.
# When absent, naf_component is inferred from data.yml extra.tag.
# Example:
# naf_mappings:
#   netbox-community:
#     naf_component: intent
#     naf_subfunctions: [Intended State / SoT]
#     secondary_naf_components: []
naf_mappings: {}
