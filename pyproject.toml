[project]
name = "network-automation-landscape-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "jsonschema>=4.23.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18.6",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
